<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokedex</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="font.css">
    </link>
    <script src="array.js"></script>
    <script src="script.js"></script>
    <link rel="icon" type="image/vnd.icon" href="#" alt="favicon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.0.0/dist/chart.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Economica:ital,wght@0,400;0,700;1,400;1,700&family=Raleway:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap"
        rel="stylesheet">

</head>

<body onload="loadPokemon()">
<div id="pokemonOverview"></div>
    <!-- Detail Card start -->
    <div id="pokemonDetailCard" class="">
        <div class="detailCardHead">
            <div class="d-flex justify-content-between mx-3">
                <div class="d-flex flex-column">
                    <h1 id="pokemonName"></h1>
                    <div id="pokemonTypes"></div>
                </div>
                <div class="d-flex justify-content-end align-items-center">
                    <h2 id="pokemonId">#001</h2>
                </div>
            </div>
        </div>
        <div class="detailCardBody">
            <img id="pokemonDetailImage">
            <nav>
                <ul class="nav nav-tabs" id="myTab" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active" id="about-tab" data-bs-toggle="tab" data-bs-target="#about"
                            type="button" role="tab" aria-controls="about" aria-selected="true"
                            onclick="loadAbout()">About</button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="basestats-tab" data-bs-toggle="tab" data-bs-target="#basestats"
                            type="button" role="tab" aria-controls="basestats" aria-selected="false"
                            onclick="loadBaseStats()">Base Stats</button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="evolution-tab" data-bs-toggle="tab" data-bs-target="#evolution"
                            type="button" role="tab" aria-controls="evolution" aria-selected="false"
                            onclick="loadEvolution()">Evolution</button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="moves-tab" data-bs-toggle="tab" data-bs-target="#moves"
                            type="button" role="tab" aria-controls="moves" aria-selected="false"
                            onclick="loadMoves()">Moves</button>
                    </li>
                </ul>
                <div class="tab-content" id="myTabContent">
                    <div class="tab-pane fade show active" id="about" role="tabpanel" aria-labelledby="about-tab">
                    </div>
                    <div class="tab-pane fade" id="basestats" role="tabpanel" aria-labelledby="basestats-tab"></div>
                    <div class="tab-pane fade" id="evolution" role="tabpanel" aria-labelledby="evolution-tab"></div>
                    <div class="tab-pane fade" id="moves" role="tabpanel" aria-labelledby="moves-tab"></div>
                </div>
            </nav>
            <div id="navContent">
            </div>
        </div>
    </div>
<button type="button" class="btn btn-primary my-3" id="loadMoreButton">Load more Pokemon</button>


</body>

</html>
